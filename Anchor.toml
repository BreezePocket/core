[toolchain]
package_manager = "npm"

[features]
resolution = true
skip-lint = false

[programs.localnet]
breezepocket = "BeytdpJYSGP1oFRxEiBLkSRGuW6HW3Pk9dqSZCuSteQ9"

[programs.devnet]
breezepocket = "BeytdpJYSGP1oFRxEiBLkSRGuW6HW3Pk9dqSZCuSteQ9"

[programs.testnet]
breezepocket = "BeytdpJYSGP1oFRxEiBLkSRGuW6HW3Pk9dqSZCuSteQ9"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
# Tests run on LiteSVM (in-process SVM with a controllable clock), so they need
# neither a local validator nor a deploy: `anchor build && npm test`.
test = "npx ts-mocha -p ./tsconfig.json -t 1000000 \"tests/**/*.ts\""
